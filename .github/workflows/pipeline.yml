# Automatisation : prédictions du soir, règlement et cotes de clôture le matin, puis publication de la page.
#
# Déclenchement à l'heure exacte par cron-job.org (fuseau Europe/Paris), via l'API workflow_dispatch :
#   toutes les heures à :47  task=predict  règlement des paris terminés, puis prédiction des matchs pas encore
#                                          prédits qui commencent dans moins de 3 h (chaque match prédit une fois)
#   8 h 13                   task=settle   résultats, règlement des paris et cotes de clôture de la veille
# Le cron GitHub ci-dessous n'est qu'un filet de sécurité pour le règlement : GitHub retarde les déclenchements
# planifiés de plusieurs heures (jusqu'à 7 h observé), voire les saute. Un passage de prédiction raté est rattrapé
# par le suivant, une heure plus tard.
name: NHL Predictor

on:
  schedule:  # heures UTC (Paris = UTC+2 l'été, UTC+1 l'hiver)
    - cron: "13 6 * * *"   # secours du règlement de 8 h 13 (sans effet s'il a déjà été fait)
  workflow_dispatch:
    inputs:
      task:
        description: "Tâche (lancée par cron-job.org ou à la main)"
        type: choice
        options: [predict, settle, odds, publier]
        default: publier

permissions:
  contents: write  # enregistrer le registre de paris et les prédictions dans le dépôt
  pages: write
  id-token: write

concurrency:
  group: nhl-predictor
  cancel-in-progress: false

env:
  # Nemotron 3 Super gratuit renvoie 404 depuis le 20 octobre 2026 (modèle retiré chez le fournisseur) ; remplacé
  # par son successeur, puis dots-3 et Gemma en secours (testés sur VGK @ STL du 22 octobre : absents justes)
  NHL_LLM: "nvidia/nemotron-3.5-super-vl:free,dots-studio/dots-3-note-preview:free,google/gemma-4-26b-a4b-it:free"
  PYTHONIOENCODING: utf-8
  PYTHONWARNINGS: ignore

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10

      - name: Données reconstructibles (cache)
        uses: actions/cache@v6
        with:
          path: |
            data/*.json
            data/news
          key: nhl-data-${{ github.run_id }}
          restore-keys: nhl-data-

      - name: Tâche
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}
        run: |
          case "${{ github.event.schedule }}" in
            "13 6 * * *") TASK=settle ;;
            *) TASK="${{ inputs.task }}" ;;
          esac
          echo "Tâche : $TASK"
          if [ "$TASK" = predict ]; then uv run python app.py settle; fi
          if [ "$TASK" != publier ]; then uv run python app.py "$TASK"; fi
          # cotes de clôture (qualité des paris) : 1 requête OddsPapi décomptée par jour ; un échec ne bloque pas le règlement
          if [ "$TASK" = settle ]; then uv run python app.py odds || echo "Cotes de clôture indisponibles aujourd'hui"; fi
          uv run python app.py publier  # recalcule les données de la page et la publie sur GitHub Pages

      - name: Enregistrer les données dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Données : $(date -u '+%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      # Mise en ligne retentée une fois : les 9 et 10 novembre, GitHub ne listait pas encore le fichier de la page
      # juste après son envoi (« Found 0 artifact(s) »). Le passage n'échoue que si les deux tentatives ratent.
      - id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Attente avant la deuxième tentative de mise en ligne
        if: steps.deploy.outcome == 'failure'
        run: sleep 30

      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5

      - name: Alerte (actualité non lue)
        if: ${{ !cancelled() }}  # même si la mise en ligne a échoué : une panne de lecture ne doit pas passer inaperçue
        run: |
          # écrit par app.py quand des matchs ont été prédits sans qu'aucune actualité soit lue : prédictions
          # enregistrées et publiées, puis échec du passage pour que GitHub envoie un mail
          if [ -f alerte.txt ]; then echo "::error::$(cat alerte.txt)"; exit 1; fi
