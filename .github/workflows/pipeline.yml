# Automatisation : prédictions du soir, règlement et cotes de clôture le matin, puis publication de la page.
# Heures en UTC (heure de Paris = UTC+2 l'été, UTC+1 l'hiver). GitHub peut décaler un déclenchement de quelques minutes.
name: NHL Predictor

on:
  # Minutes décalées des heures pleines : GitHub retarde fortement les déclenchements à :00 et :30 (jusqu'à 4 h observé).
  # Chaque passage de prédiction règle aussi les paris terminés : un règlement retardé ou sauté est rattrapé.
  schedule:
    - cron: "17 16 * * *"  # prédictions : 18 h 17 à Paris (été), après les compositions probables
    - cron: "47 21 * * *"  # rattrapage, 23 h 47 à Paris (été) : seuls les matchs restés sans prédiction
    - cron: "13 6 * * *"   # résultats, règlement des paris et cotes de clôture de la veille : 8 h 13 à Paris (été)
  workflow_dispatch:
    inputs:
      task:
        description: "Tâche à lancer à la main"
        type: choice
        options: [predict, rescue, settle, odds, export]
        default: export

permissions:
  contents: write  # enregistrer le registre de paris et les prédictions dans le dépôt
  pages: write
  id-token: write

concurrency:
  group: nhl-predictor
  cancel-in-progress: false

env:
  NHL_LLM: "nvidia/nemotron-3-super-120b-a12b:free,google/gemma-4-26b-a4b-it:free,google/gemma-4-31b-it:free"
  PYTHONIOENCODING: utf-8
  PYTHONWARNINGS: ignore

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Démarrage de la simulation (planification active à partir du 7 octobre 2026, UTC)
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [[ "$(date -u +%F)" < "2026-10-07" ]]; then
            echo "Passage planifié ignoré : la simulation démarre le 2026-10-07."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'

      - uses: astral-sh/setup-uv@v6
        if: steps.gate.outputs.go == 'true'

      - name: Données reconstructibles (cache)
        if: steps.gate.outputs.go == 'true'
        uses: actions/cache@v4
        with:
          path: |
            data/*.json
            data/news
          key: nhl-data-${{ github.run_id }}
          restore-keys: nhl-data-

      - name: Tâche
        if: steps.gate.outputs.go == 'true'
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}
        run: |
          case "${{ github.event.schedule }}" in
            "17 16 * * *") TASK=predict ;;
            "47 21 * * *") TASK=rescue ;;
            "13 6 * * *") TASK=settle ;;
            *) TASK="${{ inputs.task }}" ;;
          esac
          echo "Tâche : $TASK"
          if [ "$TASK" = predict ] || [ "$TASK" = rescue ]; then uv run python app.py settle; fi
          if [ "$TASK" != export ]; then uv run python app.py "$TASK"; fi
          # cotes de clôture (qualité des paris) : 1 requête OddsPapi décomptée par jour ; un échec ne bloque pas le règlement
          if [ "$TASK" = settle ]; then uv run python app.py odds || echo "Cotes de clôture indisponibles aujourd'hui"; fi
          uv run python app.py export

      - name: Enregistrer les données dans le dépôt
        if: steps.gate.outputs.go == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Données : $(date -u '+%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          fi

      - uses: actions/configure-pages@v5
        if: steps.gate.outputs.go == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.gate.outputs.go == 'true'
        with:
          path: site

      - id: deploy
        if: steps.gate.outputs.go == 'true'
        uses: actions/deploy-pages@v4
